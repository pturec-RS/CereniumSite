<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights | Cerenium Technologies | Oracle Health Perspectives</title>
  <meta name="description" content="Insights and perspectives on Oracle Health, Cerner Millennium, EHR strategy, Revenue Cycle optimization, and healthcare IT from the consultants at Cerenium Technologies." />
  <meta name="keywords" content="Oracle Health insights, Cerner blog, healthcare IT perspectives, EHR strategy, Oracle Health consulting blog" />
  <link rel="canonical" href="https://cereniumtech.com/insights.html" />
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">

  <meta property="og:title" content="Insights | Cerenium Technologies | Oracle Health Perspectives" />
  <meta property="og:description" content="Practical guidance on Oracle Health strategy, Cerner Millennium optimization, and healthcare IT from consultants who work in these systems every day." />
  <meta property="og:url" content="https://cereniumtech.com/insights.html" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="about.css" />
  <link rel="stylesheet" href="insights.css" />
</head>

<body>
  <div id="nav-placeholder"></div>

  <main id="main-content">

    <!-- ── PAGE HERO ── -->
    <section class="page-hero" aria-label="Insights page hero">
      <div class="page-hero-bg" role="presentation">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1920&q=80" alt="" aria-hidden="true" loading="eager" />
        <div class="hero-overlay"></div>
      </div>
      <div class="container page-hero-content">
        <span class="eyebrow">Insights</span>
        <h1>Perspectives from<br /><em class="hero-italic">the Oracle Health field.</em></h1>
        <p>Practical guidance on Oracle Health strategy, Cerner Millennium optimization, revenue cycle, and more — written by consultants who work in these systems every day.</p>
      </div>
    </section>

    <!-- ── ARTICLES GRID ── -->
    <section class="insights-articles" aria-labelledby="insights-grid-heading">
      <div class="container">
        <div class="reveal">
          <span class="eyebrow">Latest Insights</span>
          <h2 id="insights-grid-heading" class="section-title">From the field.</h2>
          <div class="gold-rule"></div>
        </div>

        <div class="stubs-grid" id="articles-grid" role="list" aria-label="Oracle Health insights articles">
          <!-- Populated by JavaScript from articles.json -->
        </div>

        <div class="load-more-wrap" id="load-more-wrap" aria-live="polite">
          <button
            class="btn btn-secondary"
            id="load-more-btn"
            aria-label="Load more insights articles"
            style="display:none;"
          >
            Load More Insights
          </button>
        </div>

      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>
  <script src="components.js"></script>

  <script>
    (function () {
      const BATCH = 6;
      let allArticles = [];
      let shown = 0;

      function buildCard(article) {
        return `
          <article class="stub-card stub-card--linked " role="listitem">
            <div class="insight-tag" aria-label="Category: ${article.category}">${article.category}</div>
            <h3>${article.title}</h3>
            <p>${article.excerpt}</p>
            <div class="stub-card-footer">
              <span class="stub-read-time" aria-label="${article.readTime}">${article.readTime}</span>
              <a href="${article.url}" class="stub-read-link" aria-label="Read: ${article.title}">
                Read Article <span aria-hidden="true">→</span>
              </a>
            </div>
          </article>`;
      }

      function renderBatch() {
        const grid = document.getElementById('articles-grid');
        const btn = document.getElementById('load-more-btn');
        const nextBatch = allArticles.slice(shown, shown + BATCH);

        nextBatch.forEach(function (article) {
          const temp = document.createElement('div');
          temp.innerHTML = buildCard(article);
          const card = temp.firstElementChild;
          grid.appendChild(card);

          // Trigger reveal animation for newly added cards
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              card.classList.add('is-visible');
            });
          });
        });

        shown += nextBatch.length;

        if (shown >= allArticles.length) {
          btn.style.display = 'none';
        } else {
          btn.style.display = 'inline-flex';
        }
      }

      fetch('insights/articles.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          allArticles = data;
          renderBatch();

          document.getElementById('load-more-btn').addEventListener('click', function () {
            renderBatch();
          });
        })
        .catch(function () {
          // Fallback: show a graceful message if fetch fails (e.g. file:// protocol in dev)
          document.getElementById('articles-grid').innerHTML =
            '<p style="color:#4A5568;font-family:var(--font-body);grid-column:1/-1;padding:2rem 0;">Unable to load articles. If viewing locally, use Live Server or a local web server.</p>';
        });
    })();
  </script>

</body>
</html>
